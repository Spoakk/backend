[package]
name = "spoak-backend"
version = "0.2.6"
edition = "2021"

[build-dependencies]
cc = "1"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "6"
sentry = { version = "0.47", features = ["tracing", "tower", "tower-axum-matched-path"] }
bytes = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[profile.release.build-override]
opt-level = 3
