[build]
builder = "NIXPACKS"
buildCommand = "RUSTFLAGS='-C target-cpu=native -C link-arg=-s' cargo build --release && cp target/release/spoak-backend /usr/local/bin/spoak-backend"

[deploy]
startCommand = "/usr/local/bin/spoak-backend"
healthcheckPath = "/api/v2/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
