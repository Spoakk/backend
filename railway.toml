[build]
builder = "NIXPACKS"
buildCommand = "cargo build --release && cp target/release/spoak-backend /usr/local/bin/spoak-backend"

[deploy]
startCommand = "/usr/local/bin/spoak-backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
